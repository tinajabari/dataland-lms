{% extends '_base.html' %}

{% block page_title %}Delete post{% endblock page_title %}

{% block hero %}{% endblock hero %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card p-4 p-md-5 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger display-5 mb-3"></i>
                <h3 class="fw-bold">Are you sure?</h3>
                <p class="text-muted">
                    Are you sure you want to permanently delete
                    <strong>"{{ post.title }}"</strong>?
                </p>
                <form method="POST" class="d-flex justify-content-center gap-2 mt-3">
                    {% csrf_token %}
                    <a href="{% url 'post_detail' post.id %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                    <button class="btn btn-danger" type="submit">
                        <i class="bi bi-trash me-1"></i>Yes, Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
